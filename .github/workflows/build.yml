---
name: Build
permissions:
  contents: read

# Every branch push gets a quick Windows x64 build (it also shows up as the check on a pull
# request for that branch). The full set - Windows x64 + arm64, macOS, Linux AppImage and
# Steam Link - runs when something lands on master, and on demand from the Actions tab.
on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      ci_version: ${{ steps.set-ci-version.outputs.ci_version }}
    steps:
      - name: Set CI version
        id: set-ci-version
        shell: bash
        run: |
          CI_VERSION=`echo ${GITHUB_SHA} | cut -c1-6`
          echo "ci_version=${CI_VERSION}" >> "${GITHUB_OUTPUT}"

  # Linux AppImage, Steam Link, macOS and Windows arm64 are slow, so they only run for
  # master and manual runs.
  build-appimage:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
    needs: setup
    uses: ./.github/workflows/build-appimage.yml
    with:
      ci_version: ${{ needs.setup.outputs.ci_version }}

  build-steamlink:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
    needs: setup
    uses: ./.github/workflows/build-steamlink.yml
    with:
      ci_version: ${{ needs.setup.outputs.ci_version }}

  build-windows-macos:
    needs: setup
    uses: ./.github/workflows/build-win-mac.yml
    with:
      ci_version: ${{ needs.setup.outputs.ci_version }}
      windows_only: ${{ github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/master' }}
