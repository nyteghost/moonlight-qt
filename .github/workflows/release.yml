name: Release
# Publishes a GitHub Release (with portable Windows zips and the macOS dmg) when a
# version tag is pushed, for example:  git tag v6.2.1 && git push origin v6.2.1
# The tag must match app/version.txt (6.2.1 <-> v6.2.1) or the run stops early.

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  # "Run workflow" button: publishes v<app/version.txt> from the chosen branch (creates the tag)
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      ci_version: ${{ steps.info.outputs.ci_version }}
      version: ${{ steps.info.outputs.version }}
      tag: ${{ steps.info.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches app/version.txt
        id: info
        shell: bash
        run: |
          FILE_VERSION="$(tr -d '[:space:]' < app/version.txt)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${FILE_VERSION}"
          fi
          if [ "${TAG#v}" != "${FILE_VERSION}" ]; then
            echo "::error::Tag ${TAG} does not match app/version.txt (${FILE_VERSION}). Bump app/version.txt, commit, and re-tag."
            exit 1
          fi
          echo "version=${FILE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "ci_version=$(echo ${GITHUB_SHA} | cut -c1-6)" >> "${GITHUB_OUTPUT}"

  build:
    needs: check-version
    uses: ./.github/workflows/build-win-mac.yml
    with:
      ci_version: ${{ needs.check-version.outputs.ci_version }}

  publish:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.check-version.outputs.version }}
      TAG: ${{ needs.check-version.outputs.tag }}
      CI_VERSION: ${{ needs.check-version.outputs.ci_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: app/whatsnew.txt

      - uses: actions/download-artifact@v6
        with:
          path: artifacts
          pattern: Vibelight-*

      - name: Package release files
        shell: bash
        run: |
          mkdir -p release
          for arch in x64 arm64; do
            dir="artifacts/Vibelight-Windows-${arch}-${CI_VERSION}"
            if [ -d "$dir" ]; then
              # portable.dat next to the exe makes Vibelight keep its settings in this folder
              touch "$dir/portable.dat"
              (cd "$dir" && zip -qr "../../release/Vibelight-${VERSION}-Windows-${arch}-portable.zip" .)
            fi
          done
          cp artifacts/Vibelight-macOS-${CI_VERSION}/*.dmg "release/Vibelight-${VERSION}-macOS.dmg" 2>/dev/null || true
          ls -l release

      - name: Create GitHub Release
        shell: bash
        run: |
          # The same text the app shows in its "What's new" window, followed by GitHub's changelog
          {
            echo "## What's new in ${VERSION}"
            echo
            cat app/whatsnew.txt
            echo
          } > release-notes.md
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            # A release for this tag was already created by hand: attach the files to it
            gh release upload "${TAG}" release/* --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${TAG}" release/* \
              --target "${GITHUB_SHA}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Vibelight ${VERSION}" \
              --notes-file release-notes.md \
              --generate-notes
          fi
