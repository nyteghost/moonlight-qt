name: Sync upstream
# Checks the original Moonlight repository once a week. When it has new commits, this
# merges them into a branch named upstream-sync/<date> and opens a pull request into
# master so you can review and test before merging. If the merge conflicts (or touches
# workflow files, which the default token may not push), it opens an issue instead.
#
# You can also run it by hand from the Actions tab ("Run workflow").
#
# Optional: add a repository secret called SYNC_TOKEN (a personal access token with
# "repo" and "workflow" scopes) so pull requests can include upstream workflow changes
# and so the build checks start on them automatically.

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Check for new upstream commits
        id: check
        shell: bash
        run: |
          git remote add upstream https://github.com/moonlight-stream/moonlight-qt.git
          git fetch --quiet upstream master
          NEW=$(git rev-list --count HEAD..upstream/master)
          echo "new_commits=${NEW}" >> "${GITHUB_OUTPUT}"
          echo "Upstream has ${NEW} commit(s) that master does not."

      - name: Merge upstream into a review branch
        if: steps.check.outputs.new_commits != '0'
        id: merge
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="upstream-sync/$(date -u +%Y-%m-%d)"
          echo "branch=${BRANCH}" >> "${GITHUB_OUTPUT}"

          # Nothing to do if a pull request for upstream changes is already open
          if [ -n "$(gh pr list --state open --search 'Sync with upstream Moonlight in:title' --json number --jq '.[].number')" ]; then
            echo "result=already_open" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git checkout -b "${BRANCH}"
          if ! git merge --no-edit upstream/master; then
            git merge --abort || true
            echo "result=conflict" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if git diff --name-only origin/master HEAD | grep -q '^\.github/workflows/' && [ -z "${{ secrets.SYNC_TOKEN }}" ]; then
            echo "result=workflows" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git push origin "${BRANCH}"
          echo "result=ok" >> "${GITHUB_OUTPUT}"

      - name: Open a pull request
        if: steps.merge.outputs.result == 'ok'
        shell: bash
        run: |
          BRANCH="${{ steps.merge.outputs.branch }}"
          gh pr create --base master --head "${BRANCH}" \
            --title "Sync with upstream Moonlight ($(date -u +%Y-%m-%d))" \
            --body "Automatic merge of new commits from moonlight-stream/moonlight-qt. Review the changes, let the build pass, test the Windows artifact, then merge."
          # Pull requests opened with the default token don't start builds by themselves
          gh workflow run build.yml --ref "${BRANCH}" || true

      - name: Open an issue when a manual sync is needed
        if: steps.merge.outputs.result == 'conflict' || steps.merge.outputs.result == 'workflows'
        shell: bash
        run: |
          if [ -n "$(gh issue list --state open --search 'Upstream sync needs a manual merge in:title' --json number --jq '.[].number')" ]; then
            exit 0
          fi
          if [ "${{ steps.merge.outputs.result }}" = "conflict" ]; then
            REASON="The new upstream commits conflict with changes in this fork."
          else
            REASON="The new upstream commits change files in .github/workflows, which the default token can't push. Add a SYNC_TOKEN secret (see the comments in .github/workflows/sync-upstream.yml) or merge by hand."
          fi
          gh issue create \
            --title "Upstream sync needs a manual merge" \
            --body "${REASON}

          To merge by hand:
          \`\`\`
          git fetch upstream master
          git checkout -b upstream-sync/manual
          git merge upstream/master
          \`\`\`
          Resolve any conflicts, push the branch, and open a pull request into master."
